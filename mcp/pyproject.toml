[project]
name = "dbu-waste-finder-mcp"
version = "0.1.0"
description = "MCP server: Databricks cost diagnosis from system tables + Asset Bundle fix diffs (read-only)"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "databricks-sql-connector>=3", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dbu-waste-finder-mcp = "dbu_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
